name: build-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/VideoCutter.spec

      - name: Self-test the built exe
        shell: pwsh
        run: |
          # The exe is a windowed app, so wait for it explicitly and read its exit code.
          $p = Start-Process -FilePath dist\VideoCutter.exe -ArgumentList "--self-test", "report.txt" -Wait -PassThru
          Get-Content report.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          "Size: {0:N0} MB" -f ((Get-Item dist\VideoCutter.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCutter-windows
          path: dist/VideoCutter.exe

      # A push to main publishes a release for the version in video_cutter/__init__.py,
      # unless that version was already released. Bump __version__ to ship a new one.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import video_cutter; print(video_cutter.__version__)")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish."
            exit 0
          fi
          gh release create "$tag" dist/VideoCutter.exe \
            --target "${{ github.sha }}" \
            --title "Video Cutter $tag" \
            --notes "Download **VideoCutter.exe** and double-click it. No installation needed. If Windows shows \"Windows protected your PC\", click **More info** and then **Run anyway**."
