<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Cutter</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Video Cutter</h1>
      <p class="muted" data-i18n="app_subtitle"></p>
    </div>
    <div class="lang" role="group" data-i18n-title="lang_label">
      <button data-lang="en">EN</button>
      <button data-lang="uk">UA</button>
    </div>
  </header>

  <section class="output-bar" id="output-bar">
    <div class="output-line">
      <span data-i18n="output_label"></span>
      <code id="output-dir"></code>
      <button class="link" id="output-change" data-i18n="output_change"></button>
      <button class="link desktop-only" id="output-open" data-i18n="output_open"></button>
      <button class="link hidden" id="output-reset" data-i18n="output_reset"></button>
    </div>
    <form class="row hidden" id="output-form">
      <input type="text" id="output-input" data-i18n-placeholder="output_placeholder">
      <button class="primary" type="submit" data-i18n="output_save"></button>
      <button type="button" id="output-cancel" data-i18n="cancel"></button>
    </form>
    <div class="error small hidden" id="output-error"></div>
  </section>

  <nav class="tabbar">
    <div class="tabs-list" id="tabs-list" role="tablist"></div>
    <div class="tab-actions">
      <button id="new-cut" data-i18n="new_cut"></button>
      <button id="new-join" data-i18n="new_join"></button>
    </div>
  </nav>

  <div id="panels"></div>
</main>

<!-- Confirmation dialog -->
<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3 class="modal-title"></h3>
    <p class="modal-body"></p>
    <div class="row end">
      <button class="modal-cancel" data-i18n="cancel"></button>
      <button class="primary modal-ok" data-i18n="continue"></button>
    </div>
  </div>
</div>

<template id="tpl-tab">
  <div class="tab" role="tab" tabindex="0">
    <span class="tab-status"></span>
    <span class="tab-title"></span>
    <button class="tab-close" data-i18n-title="close_tab">✕</button>
  </div>
</template>

<template id="tpl-progress">
  <div class="progress-block hidden">
    <div class="progress-head"><span class="stage"></span><span class="pct"></span></div>
    <div class="bar"><div class="fill"></div></div>
    <div class="detail muted"></div>
  </div>
</template>

<!-- A "cut one video" tab -->
<template id="tpl-cut">
  <section class="panel">
    <div class="card step-source">
      <h2><span class="num">1</span> <span data-i18n="sec_video"></span></h2>
      <div class="subtabs">
        <button class="subtab active" data-sub="file" data-i18n="from_file"></button>
        <button class="subtab" data-sub="link" data-i18n="from_link"></button>
      </div>
      <div class="sub-panel" data-sub-panel="file">
        <label class="drop">
          <input type="file" class="file-input" accept="video/*,.mkv,.mov,.avi,.webm,.mp4,.m4v,.ts">
          <span data-i18n-html="drop_one"></span>
        </label>
      </div>
      <div class="sub-panel hidden" data-sub-panel="link">
        <form class="row link-form">
          <input type="url" class="link-input" placeholder="https://www.youtube.com/watch?v=..." required>
          <button type="submit" class="primary" data-i18n="download_btn"></button>
        </form>
      </div>
      <div class="source-progress"></div>
      <div class="error hidden source-error"></div>
    </div>

    <div class="card step-segments hidden">
      <h2><span class="num">2</span> <span data-i18n="sec_segments"></span></h2>
      <p class="muted source-title"></p>
      <video class="player" controls preload="metadata"></video>
      <div class="player-time muted"></div>

      <div class="options">
        <label><input type="radio" class="mode" value="keep" checked> <span data-i18n="mode_keep"></span></label>
        <label><input type="radio" class="mode" value="remove"> <span data-i18n="mode_remove"></span></label>
        <label><input type="checkbox" class="separate"> <span data-i18n="separate"></span></label>
      </div>

      <p class="hint muted" data-i18n-html="hint_time"></p>

      <div class="segments sortable"></div>
      <div class="row">
        <button class="add-segment" data-i18n="add_segment"></button>
        <span class="muted segments-total"></span>
      </div>
    </div>

    <div class="card step-result hidden">
      <h2><span class="num">3</span> <span data-i18n="sec_result"></span></h2>
      <button class="primary big run-button" data-i18n="cut_btn"></button>
      <div class="run-progress"></div>
      <div class="error hidden run-error"></div>
      <div class="result hidden"></div>
    </div>
  </section>
</template>

<!-- A "join several videos" tab -->
<template id="tpl-join">
  <section class="panel">
    <div class="card">
      <h2><span class="num">1</span> <span data-i18n="sec_join_videos"></span></h2>
      <div class="subtabs">
        <button class="subtab active" data-sub="file" data-i18n="from_file"></button>
        <button class="subtab" data-sub="link" data-i18n="from_link"></button>
      </div>
      <div class="sub-panel" data-sub-panel="file">
        <label class="drop">
          <input type="file" class="file-input" multiple accept="video/*,.mkv,.mov,.avi,.webm,.mp4,.m4v,.ts">
          <span data-i18n-html="drop_many"></span>
        </label>
      </div>
      <div class="sub-panel hidden" data-sub-panel="link">
        <form class="row link-form">
          <input type="url" class="link-input" placeholder="https://www.youtube.com/watch?v=..." required>
          <button type="submit" class="primary" data-i18n="add_link"></button>
        </form>
      </div>
      <p class="hint muted" data-i18n="join_hint"></p>
      <div class="join-items sortable"></div>
      <p class="muted join-total"></p>
    </div>

    <div class="card">
      <h2><span class="num">2</span> <span data-i18n="sec_result"></span></h2>
      <button class="primary big run-button" data-i18n="join_btn" disabled></button>
      <div class="run-progress"></div>
      <div class="error hidden run-error"></div>
      <div class="result hidden"></div>
    </div>
  </section>
</template>

<template id="tpl-segment">
  <div class="segment item" draggable="true">
    <span class="handle" data-i18n-title="drag_to_reorder">⋮⋮</span>
    <span class="seg-num"></span>
    <label><span data-i18n="seg_from"></span> <input class="seg-start" placeholder="0:00"></label>
    <button class="icon set-start" data-i18n-title="use_position">⏱</button>
    <label><span data-i18n="seg_to"></span> <input class="seg-end" data-i18n-placeholder="seg_end_placeholder"></label>
    <button class="icon set-end" data-i18n-title="use_position">⏱</button>
    <button class="icon play" data-i18n-title="play_piece">▶</button>
    <button class="icon up" data-i18n-title="move_up">↑</button>
    <button class="icon down" data-i18n-title="move_down">↓</button>
    <button class="icon remove" data-i18n-title="remove">✕</button>
  </div>
</template>

<template id="tpl-join-item">
  <div class="join-item item" draggable="true">
    <span class="handle" data-i18n-title="drag_to_reorder">⋮⋮</span>
    <span class="seg-num"></span>
    <div class="join-item-main">
      <div class="join-item-title"></div>
      <div class="join-item-status muted small"></div>
    </div>
    <button class="icon up" data-i18n-title="move_up">↑</button>
    <button class="icon down" data-i18n-title="move_down">↓</button>
    <button class="icon remove" data-i18n-title="remove">✕</button>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
